name: Bug report
description: Something isn't working correctly.
labels: ["bug"]
body:
  - type: input
    id: title
    attributes:
      label: Summary
      description: One-line description of the bug.
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Describe the actual behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What was expected
      description: Describe the behavior you expected.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      description: Steps to reproduce the issue.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Ideate version
      description: Output of `ideate --version`.
    validations:
      required: true

  - type: input
    id: macos_version
    attributes:
      label: macOS version
      description: e.g. macOS 14.5
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste a log excerpt if available. Logs are in `~/.ideate/logs/`.
      render: text
