name: Feature request
description: Propose a new feature or improvement.
labels: ["enhancement"]
body:
  - type: input
    id: title
    attributes:
      label: Summary
      description: One-line description of the feature.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: What can't you do today, or what is painful?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or change you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, and why you prefer the proposed solution.
