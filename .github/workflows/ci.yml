name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IDEATE_CONFIG_DIR: /tmp/ideate-ci

jobs:
  lint-test-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install tools
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          go install github.com/bufbuild/buf/cmd/buf@v1.70.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Generate proto
        run: cd proto && buf generate

      # Generate Wails JS bindings + build frontend before Go steps.
      # Chicken-and-egg: wails generate compiles Go (needs dist/),
      # frontend build needs wailsjs/ (generated by wails).
      # Fix: placeholder dist/ → wails generate → real frontend build.
      - name: Generate Wails bindings and build frontend
        run: |
          mkdir -p frontend/dist && touch frontend/dist/index.html
          cd cmd/ideate && wails generate module
          cd ../../frontend && npm run build

      - name: Lint proto
        run: cd proto && buf lint

      - name: Lint Go
        run: golangci-lint run ./...

      - name: Lint frontend
        run: cd frontend && npx tsc --noEmit

      - name: Test
        run: go test -race ./...

      - name: Build
        run: cd cmd/ideate && wails build

  test-ui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install tools
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          go install github.com/bufbuild/buf/cmd/buf@v1.70.0
          go install github.com/go-task/task/v3/cmd/task@v3.51.1

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Generate proto
        run: cd proto && buf generate

      # Generate Wails JS bindings + build frontend before Go steps.
      # Chicken-and-egg: wails generate compiles Go (needs dist/),
      # frontend build needs wailsjs/ (generated by wails).
      # Fix: placeholder dist/ → wails generate → real frontend build.
      - name: Generate Wails bindings and build frontend
        run: |
          mkdir -p frontend/dist && touch frontend/dist/index.html
          cd cmd/ideate && wails generate module
          cd ../../frontend && npm run build

      - name: Install Playwright
        run: cd frontend && npx playwright install chromium

      - name: Run UI tests
        run: task test:ui

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: frontend/test-results/
