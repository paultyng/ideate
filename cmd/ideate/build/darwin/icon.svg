<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Warm rounded-rect background: #211e1a, 12% corner radius = 122.88px -->
  <rect x="0" y="0" width="1024" height="1024" rx="123" ry="123" fill="#211e1a"/>

  <!-- Italic lowercase 'i' designed to evoke a lightbulb without being
       literal:
        - Enlarged amber tittle (r=90) reads as a bulb sphere.
        - Three stacked top serifs between the tittle and the stem hint
          at screw threading connecting the bulb to its base.
        - One bottom serif at the foot. All 4 serifs share the same
          shape (height 17, l/r edges sloped 0.18 = ~10° matching the
          stem's italic axis, top-left corner anchored on the stem's
          left edge at that y).
        - The bottommost top serif (#3) fuses with the stem top
          (bottom-left lands exactly on the stem's top-left corner).
          The bottom serif fuses with the stem bottom the same way.
       Vertically and horizontally centered in the 1024x1024 canvas
       (~195px margin top / 194px bottom, span centered on x=512). -->

  <!-- Italic stem: y=430-830, lean 72/400 ≈ 10° -->
  <path d="M 432 430 L 514 430 L 586 830 L 504 830 Z" fill="#e8dfd0"/>

  <!-- Top serif 1 (topmost, touches tittle): y=375-392 -->
  <path d="M 422.1 375 L 552.1 375 L 555.16 392 L 425.16 392 Z" fill="#e8dfd0"/>
  <!-- Top serif 2: y=394-411 -->
  <path d="M 425.52 394 L 555.52 394 L 558.58 411 L 428.58 411 Z" fill="#e8dfd0"/>
  <!-- Top serif 3: y=413-430, fuses stem top (bottom-left = 432) -->
  <path d="M 428.94 413 L 558.94 413 L 562 430 L 432 430 Z" fill="#e8dfd0"/>

  <!-- Bottom serif: y=813-830, fuses stem bottom (bottom-left = 504) -->
  <path d="M 500.94 813 L 630.94 813 L 634 830 L 504 830 Z" fill="#e8dfd0"/>

  <!-- Amber 'bulb' tittle -->
  <circle cx="480" cy="285" r="90" fill="#c8883a"/>
</svg>
