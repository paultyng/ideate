<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Warm rounded-rect background: #211e1a, 12% corner radius = 122.88px -->
  <rect x="0" y="0" width="1024" height="1024" rx="123" ry="123" fill="#211e1a"/>
  <!-- Italic lowercase 'i' in a Newsreader-ish serif. Hand-crafted paths,
       not a font glyph, so the .icns conversion doesn't need a font face.
       Three pieces:
        1. Slanted stem (~10 degree lean — visible as italic but not slanting off-axis).
        2. Bottom serif (asymmetric bracket, wider on the left to balance the lean).
        3. Amber tittle, centered above the stem top following the italic axis.
       No top serif: a real italic lowercase 'i' has just the tittle at the top. -->
  <!-- Stem: top x [438..520], bottom x [510..592], height 410 → ~10° lean. -->
  <path d="M 438 310 L 520 310 L 592 720 L 510 720 Z" fill="#e8dfd0"/>
  <!-- Bottom serif: bracket extending more to the left (italic 'i' serifs
       typically lean opposite the stem to anchor the glyph visually). -->
  <path d="M 458 710 L 614 710 L 614 740 L 458 740 Z" fill="#e8dfd0"/>
  <!-- Amber tittle. Centered on the stem-top's italic-axis projection:
       stem-top center x ≈ 479; lean carries the visual center ~7px right at
       the tittle height (~80px above the stem), so cx ≈ 486. -->
  <circle cx="486" cy="232" r="58" fill="#c8883a"/>
</svg>
