<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Warm rounded-rect background: #211e1a, 12% corner radius = 122.88px -->
  <rect x="0" y="0" width="1024" height="1024" rx="123" ry="123" fill="#211e1a"/>
  <!-- Italic lowercase 'i' designed to EVOKE a lightbulb without being
       literal:
        - Enlarged amber tittle reads as a bulb sphere (vs the old small dot).
        - Two slanted parallelogram serifs below the tittle hint at screw
          threading connecting the bulb to its base.
        - The italic stem + left-biased bottom serif keep the letterform
          intact at small icon sizes — at 16/32px the threading collapses
          into pleasant horizontal banding but the bulb + i still read.
       Vertical position is centered in the canvas (~190px margin top,
       ~194px bottom) so the glyph doesn't float top-heavy at Dock sizes. -->
  <!-- Italic stem: ~10° lean, 410..810 vertical. -->
  <path d="M 438 410 L 520 410 L 592 810 L 510 810 Z" fill="#e8dfd0"/>
  <!-- Bottom serif: left-biased bracket (italic stems lean right, serif
       counterweights left). -->
  <path d="M 458 800 L 614 800 L 614 830 L 458 830 Z" fill="#e8dfd0"/>
  <!-- Threading serif 1 (upper, slight slant matching the stem axis). -->
  <path d="M 430 360 L 540 360 L 552 380 L 442 380 Z" fill="#e8dfd0"/>
  <!-- Threading serif 2 (lower, parallel to #1, ~25px below). -->
  <path d="M 434 385 L 550 385 L 562 405 L 446 405 Z" fill="#e8dfd0"/>
  <!-- Amber 'bulb' tittle: r=80 (was 58) so it reads as a sphere, not a dot. -->
  <circle cx="486" cy="270" r="80" fill="#c8883a"/>
</svg>
